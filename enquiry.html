    <main>

        <section id="enquiry-introduction">

            <h2>Make an Enquiry</h2>

            <p>
                Tell STS7 about the technology service you need and
                provide some information about your project.
            </p>

        </section>


        <section id="enquiry-form">

            <form>

                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>


                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                </div>


                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone">
                </div>


                <div>
                    <label for="service">Service Required:</label>

                    <select id="service" name="service">

                        <option value="">Select a service</option>

                        <option value="website-development">
                            Website Development
                        </option>

                        <option value="software-development">
                            Software Development
                        </option>

                        <option value="computer-repairs">
                            Computer Repairs
                        </option>

                        <option value="networking">
                            Networking
                        </option>

                        <option value="it-support">
                            IT Support
                        </option>

                        <option value="technology-consulting">
                            Technology Consulting
                        </option>

                    </select>
                </div>


                <div>
                    <label for="message">Project Description:</label>

                    <textarea id="message" name="message"></textarea>
                </div>


                <div>
                    <label for="budget">Budget Range:</label>

                    <input type="text" id="budget" name="budget">
                </div>


                <div>
                    <button type="submit">Submit Enquiry</button>
                </div>

            </form>

        </section>

    </main>


    <footer>
        <p>Salv-7 Tech Solutions</p>

    </footer>
