<!DOCTYPE html>

<!-- DOCTYPE refers to the document type declaration -->

<html lang="en">

<head>

    <!-- Head contains information about the webpage -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Salv-7 Tech Solutions | Enquiry</title>

    <!-- External CSS stylesheet -->

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="header-container">

            <h1>STS7</h1>

        </div>


        <!-- NAVIGATION -->

        <nav>

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About Us
                    </a>
                </li>

                <li>
                    <a href="services.html">
                        Services
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Previous Projects
                    </a>
                </li>

                <li>
                    <a href="enquiry.html" class="active">
                        Enquiry
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact Us
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- MAIN CONTENT -->

    <main>


        <!-- PAGE TITLE -->

        <section class="page-title">

            <h2>Request a Quote</h2>

            <p>
                Tell us about your technology requirements.
            </p>

        </section>


        <!-- ENQUIRY FORM -->

        <section class="page-section">

            <div class="form-container">

                <form>


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>


                    <!-- Service -->

                    <div class="form-group">

                        <label for="service">
                            Service Required
                        </label>

                        <select
                            id="service"
                            name="service"
                            required
                        >

                            <option value="">
                                Select a service
                            </option>

                            <option value="website-development">
                                Website Development
                            </option>

                            <option value="software-development">
                                Software Development
                            </option>

                            <option value="it-support">
                                IT Support
                            </option>

                            <option value="computer-repairs">
                                Computer Repairs
                            </option>

                            <option value="networking">
                                Networking Services
                            </option>

                        </select>

                    </div>


                    <!-- Project details -->

                    <div class="form-group">

                        <label for="message">
                            Project Details
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Tell us what you need..."
                            required
                        ></textarea>

                    </div>


                    <!-- Submit button -->

                    <button
                        type="submit"
                        class="button form-button"
                    >
                        Submit Enquiry
                    </button>


                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            Salv-7 Tech Solutions
        </p>

        <p>
            Email: info@salv7techsolutions.co.za
        </p>

        <p>
            &copy; 2026 Salv-7 Tech Solutions
        </p>

    </footer>


</body>

</html>
